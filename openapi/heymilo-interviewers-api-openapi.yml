          default: false
        ats_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ats Metadata
          description: 'ATS integration metadata for postings derived from an ATS (Import-from-ATS flow or `createPosting` with an ATS-derived `interview_template_id`). Null for postings not connected to an ATS. Common fields:

            - `source` (string): how the posting was created, e.g. `job_sync`.

            - `ats_name` (string): identifier of the ATS, e.g. `workable`, `bullhorn`.

            - `ats_job_id` (string): ID of the ATS job that backs this posting.

            - `ats_job_posting_id` (string, optional): ATS-side job-posting ID when distinct from `ats_job_id`.

            - `integration_id` (string, optional): heymilo ATS integration ID.

            - `job_ids` (string[], optional): ATS job IDs included in the mapping config.

            - `pending_activation` (bool): `true` while the agent is in the intermediate stage created by `createPosting` / `clonePosting` for ATS-derived postings. Candidate ingestion does not begin until the caller transitions out of this stage by calling `POST /postings/{posting_id}/activate`, which finalizes the posting and attaches the ATS mapping in one step.

            - `mapping_activated_at`, `mapping_activated_by` (read-only): audit fields stamped when the ATS mapping was attached.

            - `mapping_deactivated_at`, `mapping_deactivated_by` (read-only): audit fields stamped when the ATS mapping was last paused.'
          examples:
          - ats_job_id: WK-12345
            ats_name: workable
            pending_activation: true
            source: job_sync
          - ats_job_id: WK-12345
            ats_name: workable
            mapping_activated_at: '2026-05-21T15:00:00'
            mapping_activated_by: api_key:abcd1234
            pending_activation: false
            source: job_sync
        metadata:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Metadata
          description: Set of key-value pairs for storing additional information. Up to 50 keys, each key max 40 chars, each value max 500 chars.
          examples:
          - external_id: ats_12345
            source: workday
        created_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Created At
          description: Unix timestamp when the posting was created.
          examples:
          - 1739612400.0
        updated_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Updated At
          description: Unix timestamp when the posting was last updated.
          examples:
          - 1739617200.0
