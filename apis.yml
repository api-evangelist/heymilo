aid: heymilo
name: HeyMilo
description: >-
  HeyMilo AI is an agentic recruiting platform for high-volume hiring teams —
  staffing agencies, corporate recruiters, BPOs, franchises, and data-annotation
  operations. It combines candidate sourcing from your ATS, conversational SMS
  and smart-form pre-screening, resume analysis, and live AI voice and video
  interviews (with built-in cheat detection), then scores and ranks candidates
  with analytics, reporting, and fully white-labeled workflows. The HeyMilo
  Public API (v2.0.0, base https://api.heymilo.ai) exposes programmatic control
  over interviewers (postings), candidate ingestion, interview data and
  transcripts, questions, webhooks, templates, voices, phone numbers, domains,
  and ATS push/resolve — authenticated with an X-API-KEY header and rate limited
  to 300 requests per minute. A read-only hosted MCP server at
  https://mcp.heymilo.ai/mcp lets any MCP client query candidates, jobs, and
  interviews in natural language. HeyMilo raised $6M to scale agentic recruiting
  and is backed by Canaan Partners.
