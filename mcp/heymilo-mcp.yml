server:
  name: heymilo
  transport: http
  url: https://mcp.heymilo.ai/mcp
  read_only: true
  description: HeyMilo hosts a read-only Model Context Protocol server that exposes the same data surfaces
    an authenticated user sees in app.heymilo.ai, scoped to the workspaces the identity can access. Every
    tool is generated from the Public API v2 GET endpoints, plus a custom listWorkspaces tool. Writes
    are not available as tools — call the REST API directly.
auth:
  methods:
  - type: oauth2.1
    flow: authorization_code
    pkce: S256
    scopes:
    - openid
    - profile
    - email
    - offline_access
    discovery: https://mcp.heymilo.ai/.well-known/oauth-authorization-server
    protected_resource: https://mcp.heymilo.ai/.well-known/oauth-protected-resource
    bearer: Authorization
  - type: api_key
    bearer: Authorization
    notes: HeyMilo API key passed as Authorization Bearer <key>.
prompts:
- name: milo_capabilities
  description: Structured description of every write endpoint (with curl examples) so an LLM can guide
    users through creating postings, ingesting candidates, and modifying workflows against the REST API.
resources:
- uri: milo://capabilities
  description: Machine-readable capabilities resource mirroring the milo_capabilities prompt.
